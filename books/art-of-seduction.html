<style>
/* Layout: one screen. Three tabs; a deck of illustrated character cards; tapping any card,
   medallion or step opens a sheet with the detail. Look: a deck of court cards on dark aubergine. Single theme by choice. */
:root{
  --bg:#1b1220; --felt:#261a2d; --card:#f6efe6; --ink:#2a1b2e; --rose:#c2385a; --gold:#c9a24a; --muted:#b8a9bd; --mut2:#6d5a70; --rule:#3a2a42;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--card);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{flex:none;padding:12px 14px 0;border-bottom:1px solid var(--rule);background:var(--bg)}
.w{max-width:760px;margin:0 auto}
h1{font-family:var(--serif);font-size:18px;margin:0;color:var(--gold);font-weight:400;letter-spacing:.02em}
.by{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:8px}
.tab{flex:1;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 2px 9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--card);border-bottom-color:var(--rose)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg{padding:0 14px 40px}
.lead{font-size:14.5px;line-height:1.5;color:var(--muted);margin:14px 0;max-width:64ch}
.lead b{color:var(--card)}
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.deck{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:740px){.deck{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cc{background:var(--card);color:var(--ink);border:0;border-radius:10px;padding:8px 8px 10px;cursor:pointer;text-align:center;position:relative;box-shadow:0 2px 0 #0008}
.cc::before{content:attr(data-n);position:absolute;left:4px;top:4px;min-width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--serif);font-size:13px;color:var(--rose)}
.cc svg{display:block;width:100%;height:auto;border-radius:6px}
.cc b{display:block;font-family:var(--serif);font-size:16px;font-weight:400;margin-top:6px}
.cc span{display:block;font-size:11.5px;color:var(--mut2);line-height:1.3;margin-top:2px}
.meds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.meds{grid-template-columns:repeat(6,minmax(0,1fr))}}
.md{background:var(--felt);border:1px solid var(--rule);border-radius:10px;padding:10px 4px 8px;cursor:pointer;text-align:center}
.md svg{width:38px;height:38px;display:block;margin:0 auto 6px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.md span{font-size:12px;line-height:1.25;display:block}
h2{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--gold);margin:22px 0 2px}
.ph{font-size:13px;color:var(--muted);margin:0 0 8px}
.steps{display:grid;gap:6px}
.sp{display:flex;gap:10px;align-items:center;text-align:left;background:var(--felt);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;cursor:pointer}
.sp i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--rose);color:#fff;font-style:normal;font-size:12.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sp span{font-size:14.5px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:18px 0 0;max-width:64ch}

#shade{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;padding:14px 18px 24px;transform:translateY(105%);transition:transform .25s ease}
body.open #shade{opacity:1;pointer-events:auto}
body.open #sheet{transform:none}
@media (prefers-reduced-motion: reduce){#sheet,#shade{transition:none}}
.si{max-width:560px;margin:0 auto}
.sh{display:flex;gap:12px;align-items:flex-start}
#s-art{flex:none;width:96px}
#s-art svg{display:block;width:100%;height:auto;border-radius:8px}
#s-art.sm{width:56px;height:56px;background:var(--ink);border-radius:50%;display:grid;place-items:center}
#s-art.sm svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;border-radius:0}
#s-art.num{width:48px;height:48px;background:var(--rose);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.st{flex:1;min-width:0}
#s-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);font-weight:700}
#s-n{font-family:var(--serif);font-size:24px;font-weight:400;margin:2px 0;text-wrap:balance}
#s-t{font-size:14px;color:var(--mut2);font-style:italic}
#close{flex:none;border:1px solid #cbbfae;background:transparent;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
#s-body h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);margin:16px 0 3px}
#s-body p{font-size:15px;line-height:1.5;margin:0;max-width:62ch}
#s-body p.flag{border-left:3px solid var(--rose);padding-left:10px}
.nav{display:flex;gap:8px;margin-top:18px}
.nav button{flex:1;border:1px solid #cbbfae;background:transparent;border-radius:8px;padding:9px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.nav button:disabled{opacity:.35}
</style>

const SED=[
 ["siren","The Siren","Fantasy with a hint of danger",
  "Offers an escape from routine and responsibility. Everything about the Siren's presence feels heightened and slightly unreal, so being near them feels like stepping into a dream.",
  "Voice, appearance and movement are staged with care. The manner is calm and unhurried, and there is always a suggestion of risk, which makes the pursuit feel like an adventure.",
  "Cleopatra, Marilyn Monroe",
  "The image is hard to keep up for long, it attracts envy, and it tends to fade once ordinary life intrudes.",
  "You are responding to a performance. Ask what the person is like when the stage lights are off."],
 ["rake","The Rake","Wants you, and lets you feel it",
  "Gives total, reckless attention. The target feels desired above everything else, which is rare and flattering.",
  "Pursues intensely and ignores obstacles. Words are used to intoxicate more than to inform, and a reputation for being dangerous adds to the pull. The book describes two kinds: the Ardent Rake and the Demonic Rake.",
  "Don Juan (legend), Gabriele D'Annunzio, the Duke de Richelieu",
  "The intensity is real only for the moment. The Rake moves on, and a bad reputation eventually closes doors.",
  "Fast, overwhelming attention at the start says nothing about staying power. Watch what happens after the chase ends."],
 ["ideal","The Ideal Lover","Becomes what you have been missing",
  "Most people carry an unfulfilled ideal: romance, adventure, being truly understood. The Ideal Lover seems to supply exactly that.",
  "Studies what a person feels is missing from their life, then patiently reflects it back with great attention to detail.",
  "Casanova, Madame de Pompadour",
  "It takes enormous effort, and the fantasy cracks when the real person behind it shows through.",
  "Someone who seems a perfect fit very quickly may be mirroring you. Notice whether they have preferences of their own."],
 ["dandy","The Dandy","Free of the rules, hard to pin down",
  "Plays with image and with masculine and feminine traits. People who feel boxed in by their roles are drawn to that freedom.",
  "Keeps a distinctive style set slightly apart from everyone else, stays self-contained and does not try to please. The book describes the Feminine Dandy and the Masculine Dandy.",
  "Rudolph Valentino, Lou Andreas-Salomé",
  "Pushed too far, the pose insults or unsettles people, and society pushes back.",
  "The independence is attractive, but check whether there is room for your needs inside it."],
 ["natural","The Natural","The playful child who never left",
  "Spontaneous, sincere and unguarded. Being around a Natural lowers people's defences and stirs nostalgia for a simpler time.",
  "Stays playful and open and seems unable to scheme. Small weaknesses draw sympathy. The book lists four kinds: the Innocent, the Imp, the Wonder and the Undefensive Lover.",
  "Charlie Chaplin, Josephine Baker",
  "Childlike charm becomes irritating over time, especially with age, and can look like irresponsibility.",
  "Charm is not the same as reliability. See who ends up carrying the practical load."],
 ["coquette","The Coquette","Warm, then cold, then warm again",
  "Raises hope and then withdraws it. The uncertainty keeps people chasing, and the Coquette's apparent self-sufficiency makes them seem a prize.",
  "Alternates attention with distance, never fully satisfies, and appears to need no one.",
  "Joséphine Bonaparte, Andy Warhol",
  "Push and pull breeds resentment. Once the pattern is seen, affection can flip to anger.",
  "Hot and cold treatment is a pattern, not a mystery. If you feel anxious more often than happy, that is the signal."],
 ["charmer","The Charmer","Makes it all about you",
  "Gives attention and comfort. People leave a Charmer feeling better about themselves.",
  "Listens closely, flatters lightly, avoids conflict, rarely talks about themselves and makes themselves useful.",
  "Benjamin Disraeli, Pamela Harriman",
  "Does not work on people who distrust pleasantness, and can come across as slippery.",
  "Notice how little you actually know about them after many conversations."],
 ["charismatic","The Charismatic","Burning certainty",
  "Radiates inner confidence, purpose and energy. People want to believe in something, and the Charismatic gives them a focus.",
  "Shows a clear vision, speaks with force, uses theatre, appears fearless and keeps a touch of mystery.",
  "Joan of Arc, Rasputin, Elvis Presley, Malcolm X",
  "Adoration is volatile and can turn to hatred, and followers tire of constant intensity.",
  "Certainty is persuasive but it is not evidence. Judge the claims separately from the delivery."],
 ["star","The Star","A distant, dreamlike screen",
  "Glittering but vague. Because the Star gives little away, people project their own fantasies onto them.",
  "Cultivates a distinctive look and keeps a distance, seeming familiar and unreachable at once.",
  "Marlene Dietrich, John F. Kennedy",
  "The effect needs constant renewal, and public attention is fickle.",
  "Much of what you admire may be your own projection. See how much survives real contact."],
 ["anti","The Anti-Seducer","What repels",
  "The book's counter-example. Anti-Seducers are insecure and self-absorbed, and they cannot see a situation from the other person's side.",
  "Eight kinds are described: the Brute, the Suffocator, the Moralizer, the Tightwad, the Bumbler, the Windbag, the Reactor and the Vulgarian.",
  "",
  "Greene's advice is to learn these traits so you can spot them in others and correct them in yourself.",
  "Most people show one or two of these on a bad day. The useful question is which one is yours."]

const VIC=[
 ["chain","The Reformed Rake or Siren","Gave up a free, pleasure-seeking life and misses it.","Drawn to anyone who lets them feel they are the one doing the seducing again."],
 ["cloud","The Disappointed Dreamer","Grew up on fantasies and finds real life flat.","Responds to grand romance, drama and anything larger than life."],
 ["crown","The Pampered Royal","Was indulged early and bores easily.","Needs constant variety and novelty, and loses interest once things settle."],
 ["lock","The New Prude","Worried about appearances and what is proper.","Secretly excited by what they condemn, and drawn to someone who takes the blame for crossing the line."],
 ["crack","The Crushed Star","Once the centre of attention, now holding back.","Opens up when made the centre of attention again."],
 ["sprout","The Novice","Young, curious and inexperienced.","Drawn to someone who seems worldly, mixed with enough innocence not to frighten them."],
 ["flag","The Conqueror","Energetic and needs obstacles to overcome.","Loses interest in easy wins. Resistance and challenge keep them engaged."],
 ["globe","The Exotic Fetishist","Feels empty inside and looks far away for what is missing.","Attracted to whatever seems foreign or different from their own background."],
 ["bolt","The Drama Queen","Needs constant emotional turbulence.","Feels alive with conflict and reconciliation, and uneasy with calm."],
 ["specs","The Professor","Lives in the head, analysing everything.","Wants to be pulled out of thinking and into physical, unreflective experience."],
 ["mirror","The Beauty","Admired for looks all their life and unsure of anything else.","Responds to praise for what others overlook: intelligence, skill, character."],
 ["rattle","The Aging Baby","Refuses to grow up or take on responsibility.","Looks for an adult figure who indulges them without lecturing."],
 ["buoy","The Rescuer","Drawn to people with problems.","Feels needed and powerful by helping. Hooked by displays of weakness and need."],

 ["candle","The Idol Worshipper","Feels an inner lack and wants something to believe in.","Attaches to causes or people they can put on a pedestal."],

const PH=[
 ["Phase one · Separation","Stirring interest and desire",[
  ["Choose the right person","Everything depends on picking someone who is open to your influence, usually a person who feels something is missing.","Being chosen can feel like fate. Sometimes it is a calculation about who looks available."],
  ["Approach indirectly","Begin as a friend or through a third party, so no defences go up.","A sideways start is often innocent, but notice if the friendship was always a route to something else."],
  ["Send mixed signals","Be hard to read: innocent and knowing, cool and warm. Ambiguity holds attention.","If you spend a lot of time decoding someone, the confusion may be deliberate."],
  ["Appear desired by others","People want what others want, so show that you have admirers.","Triangles and talk of rivals are meant to make you compete."],
  ["Create a need","Stir a quiet discontent with the person's life, then present yourself as the answer.","Be wary of anyone who makes you feel lacking and then offers to fix it."],
  ["Insinuate","Plant ideas through hints and half-statements so the person believes the thought is their own.","If an idea about them keeps appearing in your head, ask where it came from."],
  ["Enter their spirit","Adopt their tastes, moods and rules first. People relax around a mirror of themselves.","Early, total agreement can be mirroring more than compatibility."],
  ["Create temptation","Find a weakness or an unrealised wish and dangle a glimpse of it.","Temptation works by keeping the reward just out of reach."]]],
 ["Phase two · Lead astray","Creating pleasure and confusion",[
  ["Keep them in suspense","Stay unpredictable with calculated surprises, so the other person wonders what comes next.","Surprise is pleasant. Constant unpredictability keeps you off balance."],
  ["Use words to blur","Use flattery, promises and emotionally loaded language that people want to hear.","Compare what is said with what is done."],
  ["Attend to detail","Thoughtful gestures, gifts and settings chosen for the person say more than words.","Attention to detail is lovely when it continues after the goal is reached."],
  ["Poeticise your presence","Be associated with heightened moments, then be absent, so the person idealises you.","Absence that feeds fantasy is different from someone who is simply unavailable."],
  ["Show strategic weakness","Reveal vulnerability to lower suspicion and make the other person feel stronger.","Real vulnerability comes with accountability. Staged weakness asks only for sympathy."],
  ["Blend desire and reality","Build an illusion in which the person feels they are living out a fantasy.","If it feels like a film, check who is writing the script."]]],
 ["Phase three · The precipice","Deepening the effect",[
  ["Isolate","Draw the person away from their usual surroundings, friends and habits, so they rely on you.","This is a serious warning sign in any relationship. Keep your people close."],
  ["Prove yourself","Make a dramatic gesture or sacrifice that removes lingering doubt.","One grand gesture is easier than steady, ordinary reliability."],
  ["Evoke the past","Stir childhood feelings of being protected or adored, taking a parent-like role.","Notice if you are being made to feel smaller or more dependent."],
  ["Stir the forbidden","Suggest crossing a limit together. A shared secret binds people.","Secrets that cut you off from others give the other person leverage."],
  ["Use spiritual lures","Frame the connection as destined or elevated to dissolve doubts about the physical side.","Talk of destiny early on is a way of skipping the getting-to-know-you stage."],
  ["Mix pleasure with pain","Alternate kindness with coldness, so relief feels like joy.","This is the pattern behind many unhealthy bonds. Consistency is the healthy alternative."]]],
 ["Phase four · The final move","Closing, and what comes after",[
  ["Step back and be pursued","Withdraw a little at the peak of interest so the other person does the chasing.","Sudden distance after intensity is a test of how far you will run."],
  ["Physical lures","Lower inhibitions through presence, calm and atmosphere, never through pressure.","You should never feel rushed. Your pace is the one that counts."],
  ["The bold move","When the moment is right, act decisively instead of waiting for the other person.","Boldness is only welcome where interest is clear and mutual."],
  ["Beware the aftereffects","After success comes boredom and disenchantment. Either re-seduce, or end things cleanly and quickly.","How someone behaves after they get what they wanted tells you the most."]]]
];
