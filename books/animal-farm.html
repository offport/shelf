<style>
/* Layout: one screen, three tabs. The Story tab is a farm scene and a painted barn wall that both change
   as you step through the ten chapters. Look: barn red, straw and tarred boards. Single theme by choice. */
:root{
  --bg:#f3ecd9; --panel:#fffaf0; --ink:#2a2019; --muted:#6f6252; --rule:#d9cdb2; --red:#8f2f25; --green:#2f5a3a; --tar:#2b2622; --paint:#efe9dc; --fresh:#ffd75a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
header{flex:none;background:var(--red);color:#fff6e6;padding:10px 14px 0}
.w{max-width:640px;margin:0 auto}
h1{font-family:var(--serif);font-size:18px;margin:0;font-weight:400;letter-spacing:.03em}
.by{font-size:12px;opacity:.8;margin-top:1px}
.tabs{display:flex;gap:2px;margin-top:6px}
.tab{flex:1;background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 2px 9px;font-size:13.5px;font-weight:600;color:#fff6e6;opacity:.7;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--fresh)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg{padding:0 14px 40px}
.lead{font-size:14.5px;line-height:1.5;margin:14px 0 10px;max-width:62ch;color:var(--muted)}
.lead b{color:var(--ink)}
h2{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.chs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.ch{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 0;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.ch[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.scene{border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:10px;background:var(--panel)}
.scene svg{display:block;width:100%;height:auto}
.k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700;margin-top:14px}
#ct{font-family:var(--serif);font-size:22px;font-weight:400;margin:2px 0 6px;text-wrap:balance}
#cx{font-size:15px;line-height:1.55;margin:0;max-width:62ch}

#wall{background:var(--tar);background-image:repeating-linear-gradient(90deg,transparent 0 46px,#0003 46px 48px);color:var(--paint);border-radius:6px;padding:14px 16px;font-family:var(--serif);font-size:15px;line-height:1.5;margin:0;list-style:none;counter-reset:c}
#wall li{counter-increment:c;padding-left:24px;position:relative}
#wall li::before{content:counter(c)".";position:absolute;left:0;opacity:.7}
#wall li.x{text-decoration:line-through;opacity:.35}
#wall li.one{padding-left:0;font-size:17px;text-align:center;color:var(--fresh)}
#wall li.one::before{content:none}
#wall li.none{padding-left:0;opacity:.6;font-style:italic}
#wall li.none::before{content:none}
#wall em{font-style:normal;color:var(--fresh)}
.wn{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:9px;font-size:13.5px;cursor:pointer}
.nav button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.cc{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center}
.cc svg{display:block;width:70%;height:auto;margin:0 auto}
.cc b{display:block;font-size:13.5px;margin-top:4px}
.cc span{display:block;font-size:11.5px;color:var(--muted)}
.list{display:grid;gap:6px}
.row{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 34px 10px 12px;cursor:pointer;position:relative}
.row::after{content:"+";position:absolute;right:12px;top:9px;font-size:18px;color:var(--muted);line-height:1}
.row.open::after{content:"−"}
.row .n{font-size:14.5px;font-weight:600}
.row .x{display:none;font-size:14px;line-height:1.5;margin-top:5px;max-width:62ch}
.row.open .x{display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--rule)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.4}
th{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:20px 0 0;max-width:62ch}
#shade{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:84%;overflow-y:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 18px 24px;transform:translateY(105%);transition:transform .25s ease}
body.open #shade{opacity:1;pointer-events:auto}
body.open #sheet{transform:none}
@media (prefers-reduced-motion: reduce){#sheet,#shade{transition:none}}
.si{max-width:560px;margin:0 auto}
.sh{display:flex;gap:12px;align-items:center}
#s-art{flex:none;width:84px}
#s-art svg{display:block;width:100%}
.st{flex:1;min-width:0}
#s-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700}
#s-n{font-family:var(--serif);font-size:24px;margin:2px 0}
#close{flex:none;align-self:flex-start;border:1px solid var(--rule);background:transparent;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
#s-body h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 3px}
#s-body p{font-size:15px;line-height:1.5;margin:0;max-width:62ch}

/* ---------- content ---------- */
const CH=[
 ["The dream","Old Major, an aged prize boar, gathers the animals of Manor Farm in the barn. He tells them their lives are short and miserable because humans take everything they produce, and that one day animals will rise up. He teaches them a rousing song about that future.","Old Major's speech echoes Karl Marx's argument that workers are exploited by owners, and Lenin's call to act on it."],
 ["The Rebellion","Old Major dies. The pigs, the cleverest animals, turn his ideas into a system called Animalism. When the drunken farmer Mr Jones forgets to feed them, the animals drive him out. They rename the place Animal Farm and paint Seven Commandments on the barn wall. That evening the milk goes missing.","The Russian Revolution of 1917 and the fall of Tsar Nicholas II."],
 ["The first harvest","The harvest is the best the farm has seen. The pigs do not work but direct the others. Snowball sets up committees and teaches reading. The carthorse Boxer works harder than anyone. The pigs keep the milk and apples for themselves, and Squealer explains that this is for everyone's good. Napoleon takes nine puppies away to raise.","The hopeful early years of the Soviet state, and the first privileges taken by the Party."],
 ["The Battle of the Cowshed","News of the rebellion spreads to neighbouring farms. Mr Jones returns with men to retake the farm, and Snowball leads a planned defence that drives them off. Snowball and Boxer are decorated as heroes.","The Russian Civil War of 1918 to 1921, in which the new state fought off its enemies with Trotsky leading the Red Army."],
 ["Snowball is driven out","The vain mare Mollie deserts to a human owner. Snowball and Napoleon quarrel over everything, above all Snowball's plan for a windmill. At the decisive meeting Napoleon summons nine huge dogs, the puppies now grown, and they chase Snowball off the farm. Napoleon ends the Sunday debates and then announces the windmill will be built after all.","Stalin's defeat of Trotsky, who was expelled and exiled in 1929, and the end of open debate in the Party."],
 ["The windmill and the beds","The animals work a sixty-hour week on the windmill. Napoleon begins trading with humans through a solicitor, Mr Whymper. The pigs move into the farmhouse and sleep in the beds, and the commandment about beds turns out to have two extra words. A storm brings the windmill down, and Napoleon blames Snowball.","Stalin's Five-Year Plans to industrialise at speed, and the habit of blaming every failure on Trotsky's sabotage."],
 ["Hunger and confessions","A bitter winter brings near-starvation, hidden from the outside world. The hens rebel when ordered to give up their eggs and are starved into surrender. Then Napoleon stages a meeting where animals confess to plotting with Snowball and are killed on the spot by the dogs. The old song of the rebellion is banned.","The famine of the early 1930s, and the show trials and Great Purge of 1936 to 1938."],
 ["The Battle of the Windmill","The commandment about killing gains two words. Napoleon is now called Leader and rarely seen. He sells timber to the neighbouring farmer Frederick, who pays in forged banknotes and then attacks, blowing up the finished windmill. The animals drive the men off at great cost. The pigs discover whisky, and the commandment about alcohol gains two words as well.","The Nazi-Soviet pact of 1939, Hitler's betrayal and invasion in 1941, and the terrible cost of driving Germany back."],
 ["Boxer's end","Rations are cut again, except for pigs and dogs. The farm is declared a republic with Napoleon as its only candidate for president. Boxer, the farm's most loyal worker, collapses while rebuilding the windmill. The pigs say he is going to hospital, but the van that takes him belongs to a horse slaughterer. Soon after, the pigs have money for another case of whisky.","The betrayal of the ordinary workers who had sacrificed most for the revolution."],
 ["Pigs and men","Years pass. Few remember the time before the Rebellion. The farm is richer, but only the pigs and dogs live better. One day the pigs appear walking on their hind legs, carrying whips. The Seven Commandments are gone, replaced by one. Farmers come to dinner, the farm is renamed Manor Farm, and the animals watching through the window can no longer tell pig from man.","The Tehran Conference of 1943, where Stalin sat down with the Western leaders, and the revolution ending as the thing it overthrew."]
];
// commandments in plain words: base, [chapter it changes, added words]
const CM=[["Whatever goes on two legs is an enemy"],["Whatever goes on four legs, or has wings, is a friend"],["No animal wears clothes"],["No animal sleeps in a bed",6,"with sheets"],["No animal drinks alcohol",8,"to excess"],["No animal kills another animal",8,"without cause"],["All animals are equal"]];
const WIND=[0,0,0,0,1,2,3,2,3,4];
const CAST=[
 ["major","Old Major","The dreamer","An elderly prize boar whose speech starts everything. He dies three nights later and never sees the Rebellion.","Karl Marx, and partly Lenin: the thinker whose ideas are later bent out of shape.","His skull is put on display, then quietly buried when no longer useful."],
 ["napoleon","Napoleon","The dictator","A large, fierce boar who says little and gets his own way. He uses the dogs, rewrites the rules and takes all credit.","Joseph Stalin.","Ends up ruling the farm, walking upright and dining with the farmers."],
 ["snowball","Snowball","The exiled rival","Lively, inventive and a brilliant speaker. He plans the windmill and leads the defence of the farm.","Leon Trotsky.","Chased off by the dogs, then blamed for everything that goes wrong."],
 ["squealer","Squealer","The spin doctor","A small, plump pig who can argue that black is white. He explains away every broken rule and rewrites history.","State propaganda, such as the newspaper Pravda.","Grows so fat he can barely see, still explaining."],
 ["boxer","Boxer","The loyal worker","An enormous carthorse, not clever but endlessly strong and trusting. His two rules are to work harder and to believe the Leader.","The working class, loyal and exploited.","Sold to the slaughterer when he can no longer work."],
 ["clover","Clover","The uneasy witness","A motherly mare, Boxer's close friend. She senses the commandments have changed but cannot read well enough to prove it.","Ordinary people who feel something is wrong but cannot name it.","Survives, old and stout, to see the pigs walk upright."],
 ["benjamin","Benjamin","The cynic","The oldest animal, a bad-tempered donkey who reads as well as any pig and believes nothing will ever improve.","Sceptical intellectuals who saw the truth and stayed silent.","Speaks up only once, when Boxer is taken, and too late."],
 ["mollie","Mollie","The deserter","A pretty white mare who loves sugar and ribbons and cares nothing for the Rebellion.","The comfortable classes who left Russia after the revolution.","Runs away to pull a human's cart, and is never mentioned again."],
 ["moses","Moses","The preacher","Mr Jones's tame raven, who tells of a paradise in the sky where animals go when they die.","Organised religion, the Russian Orthodox Church.","Leaves with Jones, then returns years later, and the pigs let him stay."],
 ["dogs","The dogs","The enforcers","Nine puppies taken from their mothers and raised by Napoleon in secret. They obey only him.","The secret police.","Guard Napoleon to the end."],
 ["sheep","The sheep","The chorus","Easily taught and easily led. They drown out any debate by bleating the farm's slogan.","Crowds repeating slogans without thought.","Taught a new slogan, the opposite of the old, the week the pigs stand up."],
 ["muriel","Muriel","The reader","A white goat who can read and spells out the commandments for Clover each time they seem different.","The few among the people who could check the record.","Dead by the final chapter."],
 ["jones","Mr Jones","The old master","The neglectful, hard-drinking owner of Manor Farm.","Tsar Nicholas II and the old order.","Driven out, fails to return, and dies in a home for alcoholics."],
 ["frederick","Mr Frederick","The treacherous neighbour","The tough, shrewd owner of Pinchfield, known for cruelty to his animals. He cheats Napoleon with forged notes and attacks.","Adolf Hitler and Nazi Germany.","Beaten back, after destroying the windmill."],
 ["pilkington","Mr Pilkington","The easy-going neighbour","The gentleman farmer of Foxwood, a large and neglected farm.","Britain and the Western Allies.","Toasts Napoleon at dinner, then both cheat at cards."],
 ["whymper","Mr Whymper","The go-between","A solicitor who handles Animal Farm's trade with the human world.","Westerners who did business with the Soviet Union and spread its version of events.","Buys himself a dogcart on the proceeds."]
];
const THEMES=[
 ["Power corrupts","The pigs begin as liberators and end as masters. Each privilege is small, the milk, then the beds, then the whisky, and each makes the next easier."],
 ["Language as a weapon","Squealer never uses force. He uses statistics, fear of Jones returning and the claim that the animals misremember. Control of words becomes control of thought."],
 ["Rewriting the past","The commandments change at night, Snowball's heroism becomes treachery, and nobody can prove otherwise. Whoever controls the record controls the truth."],
 ["Education and class","The pigs learn to read and write well, most animals never get past a few letters. That gap, not strength, is what lets a few rule the many."],
 ["Loyalty exploited","Boxer's virtues are real: hard work, trust, sacrifice. The regime depends on them and then discards him. Orwell's warning is about unquestioning trust."],
 ["The silent and the cynical","Benjamin sees everything and says nothing. The book suggests that staying out of it is also a choice with consequences."],
 ["A fairy story","Orwell subtitled the book a fairy story. The simple fable form makes a political argument anyone can follow, which is why it was hard to publish in 1944, when the Soviet Union was a wartime ally."]
];

/* ---------- story scene ---------- */

  const w=WIND[c-1], name=(c===1||c===10)?"MANOR FARM":"ANIMAL FARM";
  const mill=[ "",
   `<path d="M246,74 l8,-40 h14 l8,40z" fill="none" stroke="#6f6252" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M261,36 l-18,-14 M261,36 l18,-14 M261,36 l-14,18 M261,36 l14,18" stroke="#6f6252" stroke-width="1.5" stroke-dasharray="4 3"/>`,
   `<path d="M244,76 l6,-10 l8,6 l6,-9 l8,7 l6,6z" fill="#a39a8a"/><circle cx="238" cy="76" r="3" fill="#a39a8a"/><circle cx="284" cy="77" r="2.5" fill="#a39a8a"/>`,
   `<path d="M246,76 l5,-22 h20 l5,22z" fill="#b9b0a0"/><path d="M251,54 h20" stroke="#6f6252" stroke-width="2" stroke-dasharray="5 3"/>`,
   `<path d="M246,76 l8,-42 h14 l8,42z" fill="#b9b0a0"/><path d="M261,38 l-22,-16 M261,38 l22,-16 M261,38 l-16,22 M261,38 l16,22" stroke="#5b4630" stroke-width="3" stroke-linecap="round"/><circle cx="261" cy="38" r="3.5" fill="#5b4630"/>`][w];
  const flag=c>=3?`<rect x="132" y="22" width="2" height="48" fill="#5b4630"/><rect x="134" y="23" width="24" height="15" fill="#2f5a3a"/>${c<10?`<path d="M142,33 q4,-9 8,0" fill="none" stroke="#fff" stroke-width="2"/><circle cx="146" cy="33" r="1.6" fill="#fff"/>`:""}`:"";
  const dogs=c>=5?`<g fill="#3a3a3a"><path d="M196,112 h14 l3,-5 l3,5 v8 h-3 v-5 h-10 v5 h-3z"/><path d="M218,116 h14 l3,-5 l3,5 v8 h-3 v-5 h-10 v5 h-3z"/></g>`:"";
  const pigFig=c<10?`<g><ellipse cx="170" cy="112" rx="17" ry="10" fill="${c>=5?"#6d5a57":"#e7b3a6"}"/><circle cx="188" cy="107" r="8" fill="${c>=5?"#6d5a57":"#e7b3a6"}"/><path d="M184,100 l2,-6 l4,5z" fill="${c>=5?"#4e3f3d":"#d0907f"}"/><ellipse cx="195" cy="108" rx="3" ry="2.5" fill="${c>=5?"#4e3f3d":"#d0907f"}"/><path d="M160,120 v7 M167,121 v7 M175,121 v7 M181,120 v7" stroke="${c>=5?"#4e3f3d":"#d0907f"}" stroke-width="3" stroke-linecap="round"/><path d="M153,110 q-5,-4 -2,-8" fill="none" stroke="${c>=5?"#4e3f3d":"#d0907f"}" stroke-width="2"/></g>`
   :`<g><ellipse cx="172" cy="104" rx="10" ry="15" fill="#2b2b2b"/><circle cx="172" cy="84" r="8.5" fill="#6d5a57"/><ellipse cx="179" cy="86" rx="3" ry="2.5" fill="#4e3f3d"/><rect x="163" y="70" width="18" height="8" fill="#1c1c1c"/><rect x="159" y="77" width="26" height="2.5" fill="#1c1c1c"/><path d="M168,118 v10 M176,118 v10" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/><path d="M181,100 l12,-6 q6,-10 14,-2" fill="none" stroke="#5b4630" stroke-width="2" stroke-linecap="round"/></g>`;
  return `<svg viewBox="0 0 320 140" role="img" aria-label="The farm in chapter ${c}">
   <rect width="320" height="140" fill="${c>=7&&c<=9?"#dfe3e0":"#d9ecef"}"/><circle cx="292" cy="22" r="11" fill="${c>=7&&c<=9?"#f3ecd9":"#ffd75a"}"/>
   <path d="M0,92 q80,-34 170,-12 q80,-22 150,-4 v64 h-320z" fill="${c===7?"#e9e6da":"#9bbf7a"}"/><path d="M0,112 q160,-14 320,0 v28 h-320z" fill="${c===7?"#dcd8ca":"#7fa863"}"/>
   ${mill}
   <path d="M22,112 v-46 l38,-26 l38,26 v46z" fill="#8f2f25"/><path d="M16,68 l44,-31 l44,31" fill="none" stroke="#5a1d17" stroke-width="5" stroke-linejoin="round"/><rect x="46" y="82" width="28" height="30" fill="#5a1d17"/><path d="M46,82 l28,30 M74,82 l-28,30" stroke="#8f2f25" stroke-width="2"/><rect x="50" y="56" width="20" height="12" fill="#2b2622"/>

function wall(c){
  if(c===1) return `<li class="none">The wall is still bare. Nothing has been painted yet.</li>`;
  if(c===10) return CM.map(m=>`<li class="x">${m[0]}</li>`).join("")+`<li class="one">“All animals are equal, but some animals are more equal than others.”</li>`;
  return CM.map(m=>`<li>${m[0]}${m[1]&&c>=m[1]?` <em>${m[2]}</em>`:""}</li>`).join("");
}
let cur=1;
function tabStory(){
  add(`<p class="lead"><b>Step through the ten chapters.</b> Watch the farm, and watch the barn wall. The rules painted on it do not stay the same.</p>
   <div class="chs" id="chs"></div><div class="scene" id="scene"></div>
   <div class="k" id="ck"></div><h2 id="ct" style="all:unset;display:block;font-family:var(--serif);font-size:22px;margin:2px 0 6px"></h2><p id="cx"></p><p id="chist"></p>
   <h2>The barn wall</h2><ol id="wall"></ol><p class="wn" id="wn"></p>
   <div class="nav"><button id="cp">‹ Previous chapter</button><button id="cn">Next chapter ›</button></div>`);
  for(let i=1;i<=10;i++){const b=h("button","ch",i); b.setAttribute("aria-label","Chapter "+i); b.onclick=()=>go(i); $("chs").appendChild(b);}
  $("cp").onclick=()=>go(cur-1); $("cn").onclick=()=>go(cur+1); go(cur,true);
}
function go(c,keep){
  cur=Math.max(1,Math.min(10,c)); const d=CH[cur-1];
  [...$("chs").children].forEach((b,i)=>b.setAttribute("aria-pressed",i+1===cur));
  $("scene").innerHTML=scene(cur); $("ck").textContent="Chapter "+cur+" of 10"; $("ct").textContent=d[0]; $("cx").textContent=d[1];
  $("chist").innerHTML="<b>In history:</b> "+d[2]; $("wall").innerHTML=wall(cur);
  const ch=CM.filter(m=>m[1]&&cur>=m[1]&&cur<10).length;
  $("wn").textContent=cur===1?"":cur===10?"The seven are gone. One line remains, the only words quoted from the novel in this guide.":ch?ch+" of the seven now carry extra words in fresher paint. The commandments here are paraphrased.":"The Seven Commandments as first painted, paraphrased.";
  $("cp").disabled=cur===1; $("cn").disabled=cur===10; if(!keep) $("main").scrollTop=0;
}

/* ---------- cast ---------- */
let ci=0;
function openCast(i){ci=i; const c=CAST[i]; $("s-art").innerHTML=head(c[0]); $("s-k").textContent=c[2]; $("s-n").textContent=c[1];
  const b=$("s-body"); b.textContent=""; [["In the story",c[3]],["Stands for",c[4]],["What becomes of them",c[5]]].forEach(([k,v])=>{b.appendChild(h("h3",null,k)); b.appendChild(h("p",null,v));});
  $("sp").disabled=i===0; $("sn").disabled=i===CAST.length-1; $("sheet").scrollTop=0; document.body.classList.add("open");}
const close=()=>document.body.classList.remove("open");
$("close").onclick=close; $("shade").onclick=close; addEventListener("keydown",e=>{if(e.key==="Escape")close();});
$("sp").onclick=()=>openCast(ci-1); $("sn").onclick=()=>openCast(ci+1);
function tabCast(){
  add(`<p class="lead"><b>Sixteen characters, each standing for someone or something.</b> Tap a face to see their part in the story and who they represent.</p>`);
  const g=h("div","grid"); CAST.forEach((c,i)=>{const b=h("button","cc"); b.innerHTML=head(c[0]); b.append(h("b",null,c[1]),h("span",null,c[2])); b.onclick=()=>openCast(i); g.appendChild(b);}); pg.appendChild(g);
}
function tabMeaning(){
  add(`<p class="lead"><b>A fable about the Russian Revolution and what it became.</b> Orwell, a socialist, wrote it to show how a movement for equality turned into a dictatorship.</p><h2>Themes</h2>`);
  pg.appendChild(rows(THEMES));
  add(`<h2>Story and history side by side</h2>`);
  const t=h("table"); const tr=h("tr"); ["On the farm","In history"].forEach(x=>tr.appendChild(h("th",null,x))); t.appendChild(tr);
  [["Old Major's dream","Marx's ideas and Lenin's leadership"],["The Rebellion","The 1917 revolution"],["Battle of the Cowshed","The Civil War, 1918 to 1921"],["Snowball chased out","Trotsky exiled, 1929"],["Building the windmill","The Five-Year Plans"],["The hens' revolt and hunger","Forced collectivisation and famine"],["Confessions and killings","Show trials and the Great Purge"],["Deal with Frederick","The Nazi-Soviet pact, 1939"],["Battle of the Windmill","The German invasion, 1941"],["Dinner with the farmers","The Tehran Conference, 1943"]]
   .forEach(r=>{const x=h("tr"); r.forEach(c=>x.appendChild(h("td",null,c))); t.appendChild(x);}); pg.appendChild(t);
}
const TABS={Story:tabStory,Characters:tabCast,Meaning:tabMeaning};
function show(k){pg.textContent=""; $("main").scrollTop=0; [...$("tabs").children].forEach(b=>b.setAttribute("aria-selected",b.textContent===k)); TABS[k]();
  pg.appendChild(h("p","note","This is a summary in plain words of Animal Farm by George Orwell (1945), not a reproduction of the book. The drawings are this guide's own."));}
Object.keys(TABS).forEach(k=>{const b=h("button","tab",k); b.setAttribute("role","tab"); b.onclick=()=>show(k); $("tabs").appendChild(b);});
show("Story");
</script>
